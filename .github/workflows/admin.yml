# Run one SQL statement against the live game database (manual only). The result is posted as a notice
# so it can be read from the check run without the Actions logs.
name: admin-sql

on:
  workflow_dispatch:
    inputs:
      sql:
        description: SQL to run
        required: true

jobs:
  sql:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SQL: ${{ inputs.sql }}
    steps:
      - run: |
          npx -y wrangler@4.20.0 d1 execute holosynth --remote --json --command "$SQL" > out.json
          echo "::notice title=result::$(jq -c '[.[].results]' out.json | head -c 3000)"
