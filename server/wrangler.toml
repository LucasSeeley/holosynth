name = "holosynth"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

# Run the Worker near the database: every request makes several D1 reads, so distance to D1 is most of the wait.
[placement]
mode = "smart"

# database_id is filled in by the deploy workflow (it creates the database the first time).
[[d1_databases]]
binding = "DB"
database_name = "holosynth"
database_id = "__D1_ID__"

# App download files (IPA, SideStore source, build log), also filled in by the workflow.
[[kv_namespaces]]
binding = "FILES"
id = "__KV_ID__"

# The web version (../web) is served from this same Worker, so the page and the game share one origin (cookie login,
# no CORS). Files that exist there are served directly; everything else reaches the Worker.
[assets]
directory = "../web"
